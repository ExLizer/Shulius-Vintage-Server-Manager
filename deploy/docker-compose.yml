# PocketBase backend para Shulius Vintage Server Manager.
#
# Uso (desde la carpeta deploy/):
#   docker compose up -d
#
# La primera vez que arranca, las migraciones de ../pb_migrations crean todas
# las tablas automáticamente. Después entrá a http://<tu-ip>:8090/_/ para
# crear tu cuenta de superusuario.
#
# IMPORTANTE para producción: poné un reverse proxy con HTTPS delante
# (Caddy, Traefik, Nginx o el proxy de Coolify) y subí el max body size a
# 5GB+ para que los uploads de mundos grandes no se corten.
services:
  pocketbase:
    build: .
    container_name: vsm-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ../pb_hooks:/pb/pb_hooks:ro
      - ../pb_migrations:/pb/pb_migrations:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
